<html>
<head>
<title>Member Search</title>
</head>
<body bgcolor="#d4d0c8" style="font-family: Arial, Helvetica, sans-serif; font-size: 12px; margin: 0;">
<table width="100%" cellpadding="0" cellspacing="0" border="0">
<tr>
<td bgcolor="#003366" style="padding: 8px;">
<table width="100%" cellpadding="0" cellspacing="0" border="0">
<tr>
<td style="color: #ffffff;"><b>Fidelity Trust Credit Union &mdash; Member Portal</b></td>
<td align="right"><a href="{{ url_for('logout') }}" style="color: #ffffff;">Log Out</a></td>
</tr>
</table>
</td>
</tr>
</table>
<br>
<table align="center" width="400" cellpadding="0" cellspacing="0" border="1" bgcolor="#ffffff">
<tr>
<td>
<table cellpadding="4" cellspacing="0" border="0" width="100%">
<tr>
<td colspan="2" bgcolor="#e8e8e8"><b>Member Search</b></td>
</tr>
{% if error %}
<tr>
<td colspan="2"><span style="color: red;">{{ error }}</span></td>
</tr>
{% endif %}
<tr><td colspan="2">&nbsp;</td></tr>
<form method="POST" action="{{ url_for('search') }}">
<tr>
<td width="30%">Member ID:</td>
<td><input type="text" name="member_id" size="20"></td>
</tr>
<tr><td colspan="2">&nbsp;</td></tr>
<tr>
<td colspan="2" align="center"><input type="submit" value="Search"></td>
</tr>
</form>
<tr><td colspan="2">&nbsp;</td></tr>
</table>
</td>
</tr>
</table>
</body>
</html>
